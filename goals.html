<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals & Ideas — Don't Forget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="sidebar-brand">Don't<span>Forget</span></div>
    <button class="sidebar-toggle" id="sidebarToggle">Menu ▾</button>
    <ul class="nav-list" id="navList"></ul>
  </nav>

  <main class="main-content">
    <div class="wrap">
      <header>
        <p class="eyebrow" id="pageEyebrow"></p>
        <h1 id="pageTitle"></h1>
        <p class="sub" id="pageSub"></p>
        <div class="stats" id="stats"></div>
      </header>

      <div class="panel">
        <h2>Add a goal or idea</h2>
        <div class="form-grid" id="formGrid"></div>
      </div>

      <div class="data-actions">
        <button class="btn ghost" id="exportBtn">Export JSON</button>
        <button class="btn ghost" id="importBtn">Import JSON</button>
        <input type="file" id="importFile" accept="application/json">
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search…">
        <div id="statusFilterWrap"><select id="statusFilter"></select></div>
        <select id="sortSelect"></select>
      </div>
      <div class="chip-row" id="tagFilterRow" style="margin-bottom:20px;"></div>

      <div class="shelf" id="shelf"></div>
      <div class="empty" id="emptyState" style="display:none;">Nothing here yet — add your first one above.</div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script>
initTracker({
  key: "goals",
  storeKey: "goals_v1",
  eyebrow: "Catch-All",
  title: "Goals & Ideas",
  sub: "The random ideas and goals worth not losing — project ideas, habits to start, things to look up.",
  fields: [
    { key: "title", label: "Title", type: "text", placeholder: "e.g. Start going to the gym" },
    { key: "tags", label: "Tag(s)", type: "tags", placeholder: "Type one, comma-separate for more, or tap below",
      suggest: ["Habit","Project idea","Skill to learn","Career","Health","Side hustle","To research"] },
    { key: "notes", label: "Notes", type: "textarea", placeholder: "Details, first step, why it matters..." },
  ],
  statuses: [
    { value: "idea", label: "Idea", color: "purple" },
    { value: "inprogress", label: "In Progress", color: "gold" },
    { value: "done", label: "Done", color: "teal" },
  ],
  hasRating: false,
  tagField: "tags",
});
</script>
</body>
</html>
